version: '3.8'

services:
  monitoringagent:
    image: visionaininja/monitoringagent:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "4000"
    volumes:
      # Mount the config file to persist configured environments and credentials
      - ./server/config.json:/app/server/config.json
      # Mount the keys directory to persist uploaded SSH keys
      - ./server/keys:/app/server/keys
    environment:
      - PORT=4000
      - NODE_ENV=production

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - monitoringagent

volumes:
  caddy_data:
  caddy_config:
