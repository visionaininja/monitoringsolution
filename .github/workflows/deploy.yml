name: Build and Deploy Monitoring Agent

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE: visionaininja/monitoringagent
  DEPLOY_DIR: ~/monitoring-agent

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            BUILD_DATE=${{ github.run_id }}-${{ github.sha }}

      - name: Prepare deployment directory
        run: |
          mkdir -p ${{ env.DEPLOY_DIR }}/server/keys
          sudo chown -R $USER:$USER ${{ env.DEPLOY_DIR }}

          # Fix: Docker sometimes creates config.json as a directory on failed mounts
          if [ -d ${{ env.DEPLOY_DIR }}/server/config.json ]; then
            rm -rf ${{ env.DEPLOY_DIR }}/server/config.json
          fi

          # Seed config on first run
          if [ ! -f ${{ env.DEPLOY_DIR }}/server/config.json ]; then
            cp server/config.example.json ${{ env.DEPLOY_DIR }}/server/config.json
            echo "✅ Config seeded from example"
          fi

          # Always force-sync the dev SSH env from repo config.example.json
          # This ensures the correct host/key settings are always in the live config
          python3 - <<'PYEOF'
          import json, sys, os
          live = os.path.expanduser('${{ env.DEPLOY_DIR }}/server/config.json')
          example = 'server/config.example.json'
          with open(live) as f:
              cfg = json.load(f)
          with open(example) as f:
              ex = json.load(f)
          # Merge envs from example into live config (overwrites SSH settings, keeps extra keys)
          cfg.setdefault('envs', {}).update(ex.get('envs', {}))
          with open(live, 'w') as f:
              json.dump(cfg, f, indent=2)
          print("✅ Dev SSH config synced from config.example.json")
          PYEOF

          # Sync SSH key. If bastion.key is missing, generate a dedicated one and authorize it on the host VM automatically.
          KEY_PATH="${{ env.DEPLOY_DIR }}/server/keys/bastion.key"
          if [ ! -f "$KEY_PATH" ]; then
            if [ -f ~/.ssh/bastion.key ]; then
              cp ~/.ssh/bastion.key "$KEY_PATH"
              echo "✅ bastion.key copied from ~/.ssh/bastion.key"
            else
              echo "bastion.key not found in ~/.ssh. Generating a new dedicated key pair..."
              ssh-keygen -t ed25519 -N "" -f "$KEY_PATH"
              PUBKEY=$(cat "${KEY_PATH}.pub")
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
              touch ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
              if ! grep -Fq "$PUBKEY" ~/.ssh/authorized_keys; then
                echo "$PUBKEY" >> ~/.ssh/authorized_keys
                echo "✅ New dedicated public key appended to ~/.ssh/authorized_keys"
              fi
            fi
          fi
          chmod 600 "$KEY_PATH"
          echo "✅ bastion.key is present and secure"

          # Copy latest docker-compose from repo
          cp docker-compose.yml ${{ env.DEPLOY_DIR }}/

      - name: Deploy latest image
        run: |
          cd ${{ env.DEPLOY_DIR }}
          docker compose pull
          docker compose up -d --remove-orphans --force-recreate
          docker image prune -f

      - name: Patch Caddy reverse proxy (idempotent)
        run: |
          if [ -d ~/app ]; then
            sudo chown -R $USER:$USER ~/app
          fi

          # Add monitoring domain to Caddyfile (once)
          if [ -f ~/app/Caddyfile ]; then
            if ! grep -q "rdpubana-monitoring.ddns.net" ~/app/Caddyfile; then
              printf '\nrdpubana-monitoring.ddns.net {\n    reverse_proxy host.docker.internal:4000\n}\n' >> ~/app/Caddyfile
            fi
          fi

          # Inject host.docker.internal into portfolio docker-compose (once)
          python3 - <<'EOF'
          import os
          path = '/home/ubuntu/app/docker-compose.yml'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  content = f.read()
              if 'host.docker.internal' not in content:
                  lines = content.splitlines()
                  for idx, line in enumerate(lines):
                      if 'ports:' in line:
                          lines.insert(idx + 3, '    extra_hosts:')
                          lines.insert(idx + 4, '      - "host.docker.internal:host-gateway"')
                          break
                  with open(path, 'w') as f:
                      f.write(os.linesep.join(lines) + os.linesep)
          EOF

          # Reload Caddy
          if [ -d ~/app ]; then
            cd ~/app
            docker compose up -d --force-recreate caddy
          fi

      - name: Verify deployment
        run: |
          sleep 5
          CONTAINER_ID=$(docker compose -f ${{ env.DEPLOY_DIR }}/docker-compose.yml ps -q monitoringagent 2>/dev/null)
          STATUS=$(docker inspect --format='{{.State.Status}}' $CONTAINER_ID 2>/dev/null || echo "unknown")
          echo "Container status: $STATUS"
          if [ "$STATUS" != "running" ]; then
            echo "::error::Container failed to start!"
            docker compose -f ${{ env.DEPLOY_DIR }}/docker-compose.yml logs --tail=50
            exit 1
          fi
          echo "✅ Deployment successful — latest image is live"
