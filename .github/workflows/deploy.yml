name: Build and Push Monitoring Agent

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE: visionaininja/monitoringagent
  DEPLOY_DIR: ${{ github.workspace }}/../monitoring-agent

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            BUILD_DATE=${{ github.run_id }}-${{ github.sha }}

      - name: Ensure monitoring stack is running with Watchtower
        run: |
          DEPLOY_DIR=~/monitoring-agent
          mkdir -p $DEPLOY_DIR/server/keys
          sudo chown -R $USER:$USER $DEPLOY_DIR

          # Seed config only on first run
          if [ -d $DEPLOY_DIR/server/config.json ]; then
            rm -rf $DEPLOY_DIR/server/config.json
          fi
          if [ ! -f $DEPLOY_DIR/server/config.json ]; then
            cp server/config.example.json $DEPLOY_DIR/server/config.json
          fi

          # Keep SSH key in sync
          if [ -f ~/.ssh/bastion.key ]; then
            cp ~/.ssh/bastion.key $DEPLOY_DIR/server/keys/bastion.key
            chmod 600 $DEPLOY_DIR/server/keys/bastion.key
          fi

          # Copy latest docker-compose from repo
          cp docker-compose.yml $DEPLOY_DIR/

          cd $DEPLOY_DIR

          # Start stack if not running (Watchtower will handle all future updates)
          docker compose up -d --remove-orphans

          # If already running, Watchtower will auto-pull the new image within 60s
          echo "✅ Stack is up. Watchtower will auto-deploy the new image within 60s."
