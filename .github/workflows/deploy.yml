name: Build and Deploy Monitoring Agent

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image (No Cache)
        run: |
          docker build --no-cache -t visionaininja/monitoringagent:latest .

      - name: Push Docker Image
        run: |
          docker push visionaininja/monitoringagent:latest

      - name: Deploy Local Docker Compose
        run: |
          # Create app directory if it doesn't exist
          mkdir -p ~/monitoring-agent

          # Ensure the runner user owns the deployment directory (reclaims files created as root by previous docker mounts)
          sudo chown -R $USER:$USER ~/monitoring-agent

          # Create keys directory
          mkdir -p ~/monitoring-agent/server/keys

          # Clean up config.json if Docker created it as a directory during a failed mount
          if [ -d ~/monitoring-agent/server/config.json ]; then
            rm -rf ~/monitoring-agent/server/config.json
          fi

          # Copy default config if it doesn't exist on the host to avoid mount errors
          if [ ! -f ~/monitoring-agent/server/config.json ]; then
            cp server/config.example.json ~/monitoring-agent/server/config.json
          fi

          # Copy configs to deployment directory
          cp docker-compose.yml ~/monitoring-agent/

          # Navigate and deploy
          cd ~/monitoring-agent
          docker compose up -d --remove-orphans
          docker image prune -f

          # --- Dynamic Caddy Patching (Avoids modifying professional-portfolio repo) ---
          # Ensure we have permissions to edit ~/app configs if root-owned
          if [ -d ~/app ]; then
            sudo chown -R $USER:$USER ~/app
          fi

          # 1. Update Caddyfile in ~/app if it exists and doesn't have the domain
          if [ -f ~/app/Caddyfile ]; then
            if ! grep -q "rdpubana-monitoring.ddns.net" ~/app/Caddyfile; then
              echo -e "\nrdpubana-monitoring.ddns.net {\n    reverse_proxy host.docker.internal:4000\n}" >> ~/app/Caddyfile
            fi
          fi

          # 2. Inject extra_hosts into ~/app/docker-compose.yml if needed
          python3 -c "
import os
path = '/home/ubuntu/app/docker-compose.yml'
if os.path.exists(path):
    with open(path, 'r') as f:
        content = f.read()
    if 'host.docker.internal' not in content:
        lines = content.splitlines()
        for idx, line in enumerate(lines):
            if 'ports:' in line:
                lines.insert(idx + 3, '    extra_hosts:\n      - \"host.docker.internal:host-gateway\"')
                break
        with open(path, 'w') as f:
            f.write('\n'.join(lines) + '\n')
"

          # 3. Recreate Caddy container to load the new config
          if [ -d ~/app ]; then
            cd ~/app
            docker compose up -d --force-recreate caddy
          fi
